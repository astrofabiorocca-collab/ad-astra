<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">KM3NeT mette alla prova una simmetria fondamentale con i neutrini</title><desc id="desc">Nessuna evidenza di violazione nei dati analizzati. I neutrini atmosferici attraversano distanze diverse nella Terra. Un risultato negativo può imporre vincoli quantitativi. I limiti riguardano specifiche ipotesi e coefficienti. Schema concettuale, senza scale quantitative.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e4eef5"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5" fill="none" stroke="#477e9e" stroke-width="1.5"/></marker></defs><rect width="1200" height="900" rx="25" fill="url(#bg)"/><rect width="1200" height="12" fill="#b49252"/><text font-family="Arial,sans-serif" font-size="21" fill="#8b6527" font-weight="700"><tspan x="48" y="55.0">AD ASTRA · LEGGERE IL RISULTATO</tspan></text><text font-family="Arial,sans-serif" font-size="42" fill="#102d47" font-weight="700"><tspan x="48" y="108.0">KM3NeT mette alla prova una simmetria</tspan><tspan x="48" y="162.6">fondamentale con i neutrini</tspan></text><path d="M300 287h178M704 287h178" fill="none" stroke="#477e9e" stroke-width="4" marker-end="url(#arrow)"/><circle cx="200" cy="287" r="77" fill="#fff" stroke="#285e8c" stroke-width="2"/><g transform="translate(200 287)" fill="none" stroke="#285e8c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><circle cx="0" cy="0" r="35"/><circle cx="0" cy="0" r="17"/><path d="M-61 0h24M37 0h24M0-61v24M0 37v24"/></g><rect x="38" y="395" width="356" height="257" rx="17" fill="white" stroke="#c7d9e5"/><text font-family="Arial,sans-serif" font-size="19" fill="#285e8c" font-weight="700"><tspan x="58" y="433.0">01 · IL PUNTO DI PARTENZA</tspan></text><text font-family="Arial,sans-serif" font-size="28" fill="#173a55" font-weight="400"><tspan x="58" y="480.0">Nessuna evidenza di</tspan><tspan x="58" y="516.4">violazione nei dati</tspan><tspan x="58" y="552.8">analizzati</tspan></text><circle cx="600" cy="287" r="77" fill="#fff" stroke="#197b80" stroke-width="2"/><g transform="translate(600 287)" fill="none" stroke="#197b80" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M-52 36h104M-44 26v-36m29 36v-62m30 62v-44m29 44v-78"/></g><rect x="438" y="395" width="356" height="257" rx="17" fill="white" stroke="#c7d9e5"/><text font-family="Arial,sans-serif" font-size="19" fill="#197b80" font-weight="700"><tspan x="458" y="433.0">02 · IL METODO</tspan></text><text font-family="Arial,sans-serif" font-size="28" fill="#173a55" font-weight="400"><tspan x="458" y="480.0">I neutrini</tspan><tspan x="458" y="516.4">atmosferici</tspan><tspan x="458" y="552.8">attraversano distanze</tspan><tspan x="458" y="589.2">diverse nella Terra</tspan></text><circle cx="1000" cy="287" r="77" fill="#fff" stroke="#816136" stroke-width="2"/><g transform="translate(1000 287)" fill="none" stroke="#816136" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><circle cx="0" cy="0" r="50"/><path d="m-26 0 18 20 37-43"/></g><rect x="838" y="395" width="356" height="257" rx="17" fill="white" stroke="#c7d9e5"/><text font-family="Arial,sans-serif" font-size="19" fill="#816136" font-weight="700"><tspan x="858" y="433.0">03 · IL SIGNIFICATO</tspan></text><text font-family="Arial,sans-serif" font-size="28" fill="#173a55" font-weight="400"><tspan x="858" y="480.0">Un risultato negativo</tspan><tspan x="858" y="516.4">può imporre vincoli</tspan><tspan x="858" y="552.8">quantitativi</tspan></text><rect x="38" y="686" width="1124" height="147" rx="17" fill="#fff6e2" stroke="#d3b675"/><path d="m77 719 20 34H57z" fill="none" stroke="#946b26" stroke-width="3"/><path d="M77 730v10m0 5v2" stroke="#946b26" stroke-width="3"/><text font-family="Arial,sans-serif" font-size="21" fill="#946b26" font-weight="700"><tspan x="116" y="732.0">IL LIMITE DA RICORDARE</tspan></text><text font-family="Arial,sans-serif" font-size="28" fill="#173a55" font-weight="400"><tspan x="116" y="778.0">I limiti riguardano specifiche ipotesi e coefficienti</tspan></text><text font-family="Arial,sans-serif" font-size="19" fill="#456579" font-weight="400"><tspan x="38" y="873.0">N26-41 · Schema originale AD ASTRA · Non è un grafico di dati né una rappresentazione in scala.</tspan></text></svg>