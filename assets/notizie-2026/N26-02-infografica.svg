<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img"><title>Webb trova nuove strade per produrre polvere nella galassia Sextans A</title><rect width="1200" height="900" fill="#edf4fa"/><text font-family="Arial,sans-serif" font-size="22" fill="#896625"><tspan x="45" y="55.0">AD ASTRA · COMPRENDERE IL RISULTATO</tspan></text><text font-family="Arial,sans-serif" font-size="36" fill="#173a55"><tspan x="45" y="115.0">Webb trova nuove strade per produrre polvere</tspan><tspan x="45" y="163.6">nella galassia Sextans A</tspan></text><rect x="40" y="200" width="1120" height="180" rx="18" fill="white" stroke="#c4d5e3"/><text font-family="Arial,sans-serif" font-size="32" fill="#986f20"><tspan x="68" y="255.0">01</tspan></text><text font-family="Arial,sans-serif" font-size="29" fill="#173a55"><tspan x="150" y="252.0">Il fatto: il comunicato NASA riunisce risultati su polveri</tspan><tspan x="150" y="291.15">stellari e molecole carboniose in Sextans A.</tspan></text><rect x="40" y="405" width="1120" height="180" rx="18" fill="white" stroke="#c4d5e3"/><text font-family="Arial,sans-serif" font-size="32" fill="#986f20"><tspan x="68" y="460.0">02</tspan></text><text font-family="Arial,sans-serif" font-size="29" fill="#173a55"><tspan x="150" y="457.0">Il metodo: immagini e spettroscopia infrarossa del</tspan><tspan x="150" y="496.15">telescopio Webb.</tspan></text><rect x="40" y="610" width="1120" height="180" rx="18" fill="white" stroke="#c4d5e3"/><text font-family="Arial,sans-serif" font-size="32" fill="#986f20"><tspan x="68" y="665.0">03</tspan></text><text font-family="Arial,sans-serif" font-size="29" fill="#173a55"><tspan x="150" y="662.0">Il limite: una galassia vicina è un termine di confronto,</tspan><tspan x="150" y="701.15">non una copia perfetta dell’Universo primordiale.</tspan></text><text font-family="Arial,sans-serif" font-size="21" fill="#173a55"><tspan x="45" y="865.0">Sintesi concettuale · Non è un grafico di dati o un modello in scala.</tspan></text></svg>