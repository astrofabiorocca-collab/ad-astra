<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Il terminatore e l’alternanza del giorno e della notte</title><desc id="d">Raggi da sinistra illuminano la metà sinistra del disco terrestre. Vista dal Polo Nord all’equinozio; la rotazione antioraria porta un punto dalla notte al giorno e viceversa.</desc><defs><clipPath id="terra"><circle cx="465" cy="205" r="130"/></clipPath><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b17b1f"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#377cba"/></marker></defs><rect width="800" height="430" rx="15" fill="#f0f5fa"/><g font-family="Arial,sans-serif" fill="#153457" font-size="20"><text x="30" y="38" font-weight="bold">Una Terra che ruota nella luce del Sole</text><g stroke="#b17b1f" stroke-width="3" marker-end="url(#a)"><path d="M50 145H300"/><path d="M50 205H300"/><path d="M50 265H300"/></g><text x="45" y="105">Luce solare</text><circle cx="465" cy="205" r="130" fill="#10283e"/><rect x="330" y="70" width="135" height="270" fill="#a7d9ef" clip-path="url(#terra)"/><path d="M465 75V335" stroke="#d1a156" stroke-width="3"/><text x="370" y="205">Dì</text><text x="495" y="205" fill="white">Notte</text><path d="M630 205A165 165 0 0 0 465 40" fill="none" stroke="#377cba" stroke-width="3" marker-end="url(#r)"/><text x="639" y="155">Rotazione</text><text x="580" y="310">Terminatore</text><path d="M565 305L473 289" stroke="#153457"/><text x="30" y="381" font-size="17">Vista dal Polo Nord all’equinozio. Raggi paralleli, atmosfera trascurata.</text><text x="30" y="407" font-size="17">Schema AD ASTRA: non rappresenta le distanze o le dimensioni del Sole.</text></g></svg>
