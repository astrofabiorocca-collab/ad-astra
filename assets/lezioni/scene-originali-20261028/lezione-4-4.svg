<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Una superficie più grande può compensare una temperatura minore</title><desc id="desc">Confronto geometrico e bolometrico ideale. I dischi indicano raggi relativi; i colori sono convenzionali.</desc><defs><radialGradient id="earth"><stop stop-color="#a1c9d0"/><stop offset=".8" stop-color="#4c8aab"/><stop offset="1" stop-color="#214c6c"/></radialGradient><radialGradient id="sun"><stop stop-color="#fff6c5"/><stop offset=".75" stop-color="#f0cf72"/><stop offset="1" stop-color="#d9a94c"/></radialGradient></defs><rect width="1200" height="720" fill="#f8f7f1"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50.00" y="58.00" font-size="29" fill="#173c55" text-anchor="start" font-weight="600">Una superficie più grande può compensare una temperatura minore</text><circle cx="285.00" cy="360.00" r="14.00" fill="#d9c887" stroke="#173c55" stroke-width="2"/><circle cx="830.00" cy="360.00" r="140.00" fill="#d7a380" stroke="#173c55" stroke-width="2"/><text x="285.00" y="160.00" font-size="25" fill="#173c55" text-anchor="middle" font-weight="normal">Raggio R · temperatura T</text><text x="830.00" y="160.00" font-size="25" fill="#173c55" text-anchor="middle" font-weight="normal">Raggio 10R · temperatura T/2</text><text x="285.00" y="565.00" font-size="24" fill="#4b8376" text-anchor="middle" font-weight="normal">Luminosità di riferimento: 1</text><text x="830.00" y="565.00" font-size="24" fill="#4b8376" text-anchor="middle" font-weight="normal">Luminosità relativa: 6,25</text><text x="600.00" y="630.00" font-size="27" fill="#a3742c" text-anchor="middle" font-weight="normal">10² × (1/2)⁴ = 100/16 = 6,25</text><text x="50.00" y="675.00" font-size="19" fill="#647889" text-anchor="start" font-weight="normal">Confronto geometrico e bolometrico ideale. I dischi indicano raggi relativi; i colori sono convenzionali.</text></g></svg>