<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Totale e anulare: ciò che vede un singolo osservatore</title><desc id="desc">Confronto dei diametri apparenti, non delle dimensioni fisiche. Per osservare il Sole servono protezioni idonee.</desc><defs><radialGradient id="earth"><stop stop-color="#a1c9d0"/><stop offset=".8" stop-color="#4c8aab"/><stop offset="1" stop-color="#214c6c"/></radialGradient><radialGradient id="sun"><stop stop-color="#fff6c5"/><stop offset=".75" stop-color="#f0cf72"/><stop offset="1" stop-color="#d9a94c"/></radialGradient></defs><rect width="1200" height="720" fill="#f8f7f1"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50.00" y="58.00" font-size="29" fill="#173c55" text-anchor="start" font-weight="600">Totale e anulare: ciò che vede un singolo osservatore</text><text x="50.00" y="116.00" font-size="25" fill="#647889" text-anchor="start" font-weight="normal">Lo stesso allineamento può mostrare dischi di dimensione diversa.</text><circle cx="330.00" cy="350.00" r="125.00" fill="url(#sun)" stroke="none" stroke-width="2"/><circle cx="330.00" cy="350.00" r="132.00" fill="#1b3444" stroke="none" stroke-width="2"/><text x="330.00" y="555.00" font-size="24" fill="#173c55" text-anchor="middle" font-weight="normal">Totale: la Luna copre il disco</text><circle cx="875.00" cy="350.00" r="125.00" fill="url(#sun)" stroke="none" stroke-width="2"/><circle cx="875.00" cy="350.00" r="108.00" fill="#1b3444" stroke="none" stroke-width="2"/><text x="875.00" y="555.00" font-size="24" fill="#173c55" text-anchor="middle" font-weight="normal">Anulare: resta un anello di Sole</text><text x="50.00" y="675.00" font-size="19" fill="#647889" text-anchor="start" font-weight="normal">Confronto dei diametri apparenti, non delle dimensioni fisiche. Per osservare il Sole servono protezioni idonee.</text></g></svg>