<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Nel modello di Schwarzschild il raggio cresce con la massa</title><desc id="desc">Raggi proporzionali; il diametro è il doppio. I dischi rappresentano l’orizzonte, non una superficie materiale.</desc><defs><radialGradient id="earth"><stop stop-color="#a1c9d0"/><stop offset=".8" stop-color="#4c8aab"/><stop offset="1" stop-color="#214c6c"/></radialGradient><radialGradient id="sun"><stop stop-color="#fff6c5"/><stop offset=".75" stop-color="#f0cf72"/><stop offset="1" stop-color="#d9a94c"/></radialGradient></defs><rect width="1200" height="720" fill="#f8f7f1"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50.00" y="58.00" font-size="29" fill="#173c55" text-anchor="start" font-weight="600">Nel modello di Schwarzschild il raggio cresce con la massa</text><text x="50.00" y="125.00" font-size="25" fill="#647889" text-anchor="start" font-weight="normal">Orizzonti nel modello non rotante e senza carica</text><circle cx="230.00" cy="350.00" r="12.00" fill="#142a39" stroke="#357da0" stroke-width="2"/><text x="230.00" y="570.00" font-size="26" fill="#173c55" text-anchor="middle" font-weight="normal">10 masse solari</text><text x="230.00" y="615.00" font-size="24" fill="#357da0" text-anchor="middle" font-weight="normal">Raggio ≈ 30 km</text><circle cx="600.00" cy="350.00" r="36.00" fill="#142a39" stroke="#357da0" stroke-width="2"/><text x="600.00" y="570.00" font-size="26" fill="#173c55" text-anchor="middle" font-weight="normal">30 masse solari</text><text x="600.00" y="615.00" font-size="24" fill="#357da0" text-anchor="middle" font-weight="normal">Raggio ≈ 90 km</text><circle cx="980.00" cy="350.00" r="120.00" fill="#142a39" stroke="#357da0" stroke-width="2"/><text x="980.00" y="570.00" font-size="26" fill="#173c55" text-anchor="middle" font-weight="normal">100 masse solari</text><text x="980.00" y="615.00" font-size="24" fill="#357da0" text-anchor="middle" font-weight="normal">Raggio ≈ 300 km</text><path d="M75.00 465.00L115.00 465.00" fill="none" stroke="#4b8376" stroke-width="4"/><text x="75.00" y="500.00" font-size="21" fill="#4b8376" text-anchor="start" font-weight="normal">100 km</text><text x="50.00" y="675.00" font-size="19" fill="#647889" text-anchor="start" font-weight="normal">Raggi proporzionali; il diametro è il doppio. I dischi rappresentano l’orizzonte, non una superficie materiale.</text></g></svg>