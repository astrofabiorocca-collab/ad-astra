<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Il bersaglio non cambia: cambia il campo inquadrato</title><desc id="desc">Disco lunare schematico di 0,5°. I cerchi rappresentano campi reali, non dimensioni fisiche della Luna.</desc><defs><radialGradient id="earth"><stop stop-color="#a1c9d0"/><stop offset=".8" stop-color="#4c8aab"/><stop offset="1" stop-color="#214c6c"/></radialGradient><radialGradient id="sun"><stop stop-color="#fff6c5"/><stop offset=".75" stop-color="#f0cf72"/><stop offset="1" stop-color="#d9a94c"/></radialGradient></defs><rect width="1200" height="720" fill="#f8f7f1"/><g font-family="Segoe UI,Arial,sans-serif"><text x="50.00" y="58.00" font-size="29" fill="#173c55" text-anchor="start" font-weight="600">Il bersaglio non cambia: cambia il campo inquadrato</text><defs><clipPath id="field0"><circle cx="325" cy="350" r="155"/></clipPath></defs><circle cx="325.00" cy="350.00" r="155.00" fill="#17374b" stroke="#357da0" stroke-width="2"/><g clip-path="url(#field0)"><circle cx="325.00" cy="350.00" r="38.75" fill="#d7d9cc" stroke="none" stroke-width="2"/><circle cx="313.38" cy="342.25" r="8.14" fill="#acb3aa" stroke="none" stroke-width="2"/><circle cx="334.69" cy="360.46" r="5.81" fill="#b1b6ab" stroke="none" stroke-width="2"/></g><text x="325.00" y="145.00" font-size="27" fill="#173c55" text-anchor="middle" font-weight="normal">30× · campo di 2°</text><text x="325.00" y="590.00" font-size="24" fill="#4b8376" text-anchor="middle" font-weight="normal">Il disco entra interamente</text><defs><clipPath id="field1"><circle cx="875" cy="350" r="155"/></clipPath></defs><circle cx="875.00" cy="350.00" r="155.00" fill="#17374b" stroke="#357da0" stroke-width="2"/><g clip-path="url(#field1)"><circle cx="875.00" cy="350.00" r="193.75" fill="#d7d9cc" stroke="none" stroke-width="2"/><circle cx="816.88" cy="311.25" r="40.69" fill="#acb3aa" stroke="none" stroke-width="2"/><circle cx="923.44" cy="402.31" r="29.06" fill="#b1b6ab" stroke="none" stroke-width="2"/></g><text x="875.00" y="145.00" font-size="27" fill="#173c55" text-anchor="middle" font-weight="normal">150× · campo di 0,4°</text><text x="875.00" y="590.00" font-size="24" fill="#4b8376" text-anchor="middle" font-weight="normal">Il bordo del disco resta fuori</text><text x="50.00" y="675.00" font-size="19" fill="#647889" text-anchor="start" font-weight="normal">Disco lunare schematico di 0,5°. I cerchi rappresentano campi reali, non dimensioni fisiche della Luna.</text></g></svg>