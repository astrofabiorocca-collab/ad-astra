<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>La latitudine si legge nell’altezza del polo</title><rect width="800" height="490" rx="18" fill="#f0f5fa"/><g font-family="Arial,sans-serif" font-size="18" fill="#15385a" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="36" font-size="26" font-weight="bold">La latitudine si legge nell’altezza del polo</text><circle cx="260" cy="310" r="120" fill="#dce9f0" stroke="#688ba9" stroke-width="2"/><path d="M100 310H420M260 150V450" stroke="#688ba9" stroke-width="2" stroke-dasharray="5 5"/><text x="96" y="337">Equatore</text><text x="85" y="161">Asse terrestre</text><path d="M260 310L347.76 228.16L479.41 105.40" stroke="#587591" stroke-width="2"/><path d="M402.32 286.67L204.54 74.58" stroke="#278550" stroke-width="3"/><path d="M347.76 228.16V70" stroke="#2764c4" stroke-width="3" stroke-dasharray="7 5"/><circle cx="347.76" cy="228.16" r="6" fill="#17365a"/><text x="357.76" y="253.16">Osservatore</text><text x="449.41" y="95.40">Zenit</text><text x="119.54" y="64.58">Orizzonte verso N</text><text x="359.76" y="76">Polo Nord Celeste</text><path d="M305 310A45 45 0 0 0 292.91 279.31" fill="none" stroke="#be5e40" stroke-width="3"/><text x="306" y="299">φ</text><path d="M310.25 187.94A55 55 0 0 1 347.76 173.16" fill="none" stroke="#be5e40" stroke-width="3"/><text x="330.76" y="159.16">h</text><text x="526" y="257" font-size="30">h del polo = φ</text><text x="526" y="292">Esempio: 43° N → h 43°</text><text x="526" y="328" font-size="16">Orizzonte ⟂ verticale</text><text x="526" y="356" font-size="16">Polo ∥ asse terrestre</text><text x="28" y="476" font-size="16">Sezione meridiana, Terra sferica; direzioni parallele, distanze non in scala.</text></g></svg>
