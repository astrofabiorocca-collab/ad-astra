<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="train-title train-desc"><title id="train-title">Il treno ottico fotografico</title><desc id="train-desc">La luce parallela entra nell’obiettivo e converge verso il sensore. Focheggiatore, eventuale correttore e raccordi collocano la camera nel piano previsto dal progetto.</desc><rect width="900" height="490" fill="#edf3f9" rx="18"/><g font-family="Arial,sans-serif" fill="#17365f"><text x="35" y="45" font-size="26" font-weight="bold">Seguire la luce, controllare le distanze</text><path d="M90 180H475V325H90Z" fill="#bacbd9" stroke="#5b7890" stroke-width="3"/><ellipse cx="115" cy="252" rx="16" ry="66" fill="#b4e2fa" stroke="#2864d7" stroke-width="3"/><rect x="475" y="220" width="112" height="65" fill="#365b77"/><rect x="587" y="225" width="70" height="55" fill="#d1a353"/><rect x="657" y="226" width="83" height="53" fill="#536b7b"/><rect x="740" y="205" width="93" height="97" rx="15" fill="#ae4c4c"/><path d="M770 225V279" stroke="#bff2ed" stroke-width="8"/><path d="M30 208H115L770 252M30 296H115L770 252" stroke="#bc8b2d" stroke-width="3" fill="none"/><path d="M30 252H850" stroke="#6f8da3" stroke-dasharray="6 5"/><g font-size="20"><text x="53" y="126">Obiettivo</text><path d="M115 137V179" stroke="#17365f"/><text x="422" y="120">Focheggiatore</text><path d="M519 133V210" stroke="#17365f"/><text x="590" y="175">Correttore</text><path d="M620 182V216" stroke="#17365f"/><text x="741" y="124">Sensore</text><path d="M778 135V196" stroke="#17365f"/><text x="650" y="344">Raccordi</text><path d="M690 326V287" stroke="#17365f"/></g><text x="35" y="406" font-size="20">Il fuoco deve coincidere con il piano del sensore.</text><text x="35" y="444" font-size="17">Raggi schematici: gli effetti del correttore non sono tracciati. Dimensioni non in scala.</text></g></svg>
