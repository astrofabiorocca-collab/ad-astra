<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" role="img" aria-labelledby="t d"><title id="t">Quattro posizioni orbitali, assi paralleli</title><desc id="d">Schema concettuale con la Terra a sinistra in giugno e a destra in dicembre. L’estremità nord degli assi è sempre inclinata verso destra. Dimensioni e orbita non in scala.</desc><rect width="850" height="550" rx="18" fill="#091e33"/><g font-family="Arial,sans-serif" fill="#e7f1ff" font-size="18"><text x="28" y="37" font-size="27" font-weight="bold">L’asse conserva la propria direzione</text><ellipse cx="420" cy="275" rx="260" ry="165" fill="none" stroke="#607b97" stroke-dasharray="6 6"/><circle cx="420" cy="275" r="38" fill="#eabd59"/><text x="400" y="340">Sole</text><g fill="#569db8" stroke="#95cbe5" stroke-width="2"><circle cx="160" cy="275" r="36"/><circle cx="680" cy="275" r="36"/><circle cx="420" cy="110" r="36"/><circle cx="420" cy="440" r="36"/></g><g stroke="#f0c766" stroke-width="3"><path d="M131 319L189 231"/><path d="M651 319L709 231"/><path d="M391 154L449 66"/><path d="M391 484L449 396"/></g><text x="192" y="229">N</text><text x="713" y="229">N</text><text x="453" y="65">N</text><text x="453" y="395">N</text><text x="60" y="362">Giugno: nord verso il Sole</text><text x="574" y="362">Dicembre: nord opposto</text><text x="505" y="113">Equinozio</text><text x="505" y="444">Equinozio</text><text x="30" y="516" font-size="16">Schema AD ASTRA: corpi ingranditi, orbita circolare, prospettiva concettuale.</text></g></svg>
