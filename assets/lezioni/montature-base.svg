<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="t d"><title id="t">Due montature: riconoscere gli assi che fanno muovere il tubo</title><desc id="d">Confronto nel piano meridiano. A sinistra asse di azimut verticale; a destra asse polare a 42 gradi sopra l'orizzonte. I cerchi arancioni segnano assi perpendicolari al foglio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#277ba1" stroke-width="2"/></marker></defs><rect width="1600" height="1040" rx="20" fill="#f8f6ef"/><g font-family="Arial,sans-serif" fill="#183b50"><text x="55" y="62" font-size="37" font-weight="bold">LO STESSO CIELO, DUE MODI DI SEGUIRLO</text><text x="55" y="103" font-size="23">Guarda prima l'asse blu. È questo orientamento a distinguere i due sistemi.</text><rect x="35" y="135" width="750" height="705" rx="18" fill="#edf3f2" stroke="#9cb4bd"/><rect x="815" y="135" width="750" height="705" rx="18" fill="#edf3f2" stroke="#9cb4bd"/><text x="65" y="190" font-size="34" font-weight="bold">ALTAZIMUTALE</text><text x="845" y="190" font-size="34" font-weight="bold">EQUATORIALE</text><path d="M95 740H730M875 740H1510" stroke="#69917d" stroke-width="3"/><text x="95" y="780" font-size="23" fill="#39765c">Piano dell'orizzonte</text><text x="875" y="780" font-size="23" fill="#39765c">Piano dell'orizzonte</text><g stroke="#61747d" stroke-linecap="round"><path d="M395 600L255 736M395 600L525 736M395 600V736" stroke-width="13"/><path d="M1150 615L1010 736M1150 615L1290 736M1150 615V736" stroke-width="13"/></g><g fill="#e0e5e7" stroke="#556d79" stroke-width="3"><rect x="364" y="470" width="63" height="139" rx="12"/><path d="M1110 620L1174 647L1251 480L1190 452Z"/></g><g transform="translate(395 440) rotate(-30)"><rect x="-110" y="-28" width="240" height="56" rx="12" fill="#dce3e5" stroke="#294b60" stroke-width="4"/><rect x="101" y="-35" width="50" height="70" rx="5" fill="#294b60"/><path d="M-110 0H-155" stroke="#294b60" stroke-width="23"/></g><g transform="translate(1225.79 472.72) rotate(-75)"><rect x="-100" y="-28" width="240" height="56" rx="12" fill="#dce3e5" stroke="#294b60" stroke-width="4"/><rect x="110" y="-35" width="45" height="70" rx="5" fill="#294b60"/><path d="M-100 0H-140" stroke="#294b60" stroke-width="23"/></g><path d="M395 650V265" stroke="#277ba1" stroke-width="8" stroke-dasharray="13 6" marker-end="url(#arrow)"/><text x="72" y="276" font-size="26" fill="#206c90" font-weight="bold">1 · ASSE VERTICALE</text><text x="72" y="310" font-size="23">Gira a destra e a sinistra:</text><text x="72" y="341" font-size="23">cambia l'azimut.</text><ellipse cx="395" cy="590" rx="85" ry="22" fill="none" stroke="#277ba1" stroke-width="4" stroke-dasharray="8 5"/><path d="M1040 640L1411.57 305.43" stroke="#277ba1" stroke-width="8" stroke-dasharray="13 6" marker-end="url(#arrow)"/><text x="865" y="270" font-size="26" fill="#206c90" font-weight="bold">1 · ASSE POLARE (AR)</text><text x="865" y="303" font-size="23">Punta verso il polo celeste.</text><text x="865" y="335" font-size="23">È parallelo all'asse terrestre.</text><text x="1370" y="273" font-size="22" fill="#206c90">Polo N</text><path d="M1040 640H1150M1115 640A75 75 0 0 0 1095.74 589.82" stroke="#ac7a31" stroke-width="3" fill="none"/><text x="875" y="600" font-size="24" fill="#926526">42° sopra</text><text x="875" y="630" font-size="24" fill="#926526">l’orizzonte</text><g fill="#e7b765" stroke="#926526" stroke-width="3"><circle cx="395" cy="440" r="23"/><circle cx="1225.79" cy="472.72" r="23"/></g><g fill="#926526"><circle cx="395" cy="440" r="6"/><circle cx="1225.79" cy="472.72" r="6"/></g><path d="M416 453L555 485M1248 481L1442 547" stroke="#926526" stroke-width="2"/><text x="495" y="526" font-size="24" fill="#926526" font-weight="bold">2 · ALTEZZA</text><text x="495" y="559" font-size="22">Alza e abbassa</text><text x="495" y="588" font-size="22">il tubo.</text><text x="1305" y="586" font-size="24" fill="#926526" font-weight="bold">2 · DECLINAZIONE</text><text x="1305" y="617" font-size="21">Orienta il tubo a nord</text><text x="1305" y="645" font-size="21">o sud dell'equatore.</text><text x="65" y="818" font-size="21">Per seguire una stella cambiano entrambi i movimenti.</text><text x="845" y="818" font-size="21">Ben allineata, segue la stella ruotando l'asse AR.</text><text x="55" y="890" font-size="25" font-weight="bold">Il punto nel cerchio arancione indica un asse diretto verso di te, fuori dal foglio.</text><text x="55" y="928" font-size="24">Ogni coppia di assi è perpendicolare nello spazio. I tubi mostrano due puntamenti esemplificativi.</text><text x="55" y="966" font-size="24">L'asse polare si alza sopra l'orizzonte di un angolo pari alla latitudine del luogo: Roma ≈ 42°.</text><text x="55" y="1009" font-size="19" fill="#526d7b">Schema AD ASTRA nel piano meridiano; componenti meccanici semplificati, senza proporzioni commerciali.</text></g></svg>