<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img"><title>Due montature, due orientamenti degli assi</title><rect width="800" height="490" rx="18" fill="#f0f5fa"/><g font-family="Arial,sans-serif" font-size="18" fill="#15385a" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="36" font-size="26" font-weight="bold">Due montature, due orientamenti degli assi</text><text x="40" y="90" font-size="24" font-weight="bold">Altazimutale</text><text x="432" y="90" font-size="24" font-weight="bold">Equatoriale</text><path d="M198 370V160M124 267H278" stroke="#2764c4" stroke-width="5"/><path d="M162 365L110 426M232 365L284 426" stroke="#688ba9" stroke-width="4"/><path d="M158 246L246 166" stroke="#17365a" stroke-width="21"/><path d="M154 235L236 161" stroke="#aac0d5" stroke-width="5"/><ellipse cx="198" cy="365" rx="58" ry="16" fill="none" stroke="#278550" stroke-width="3"/><text x="35" y="147">Asse verticale → azimut</text><text x="35" y="316">Asse orizzontale → altezza</text><path d="M580 370L692 426M580 370L485 426M580 370L650 177" stroke="#688ba9" stroke-width="4"/><path d="M495 316L690 134" stroke="#2764c4" stroke-width="5"/><path d="M509 166L641 307" stroke="#278550" stroke-width="5"/><path d="M555 213L645 134" stroke="#17365a" stroke-width="21"/><path d="M551 202L635 129" stroke="#aac0d5" stroke-width="5"/><text x="439" y="119" font-size="17">Asse polare → polo celeste</text><text x="433" y="337" font-size="17">Asse perpendicolare → declinazione</text><text x="432" y="368" font-size="16">Asse polare inclinato della latitudine</text><text x="28" y="476" font-size="16">Schemi meccanici qualitativi; ottica, contrappesi e accessori non rappresentati in scala.</text></g></svg>