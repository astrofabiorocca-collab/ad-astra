<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620"><title>Allineare l’asse non significa puntare la camera</title><desc>Vista laterale nord a destra: asse a 42 gradi sul piano dell’orizzonte. La camera può puntare altrove con la testa superiore.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#b17a26"/></marker></defs><rect width="1000" height="620" rx="20" fill="#f4f2e9"/><path d="M30 510H970" stroke="#65756e" stroke-width="3"/><text x="720" y="546" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#173348">Orizzonte locale · NORD →</text><path d="M385 390L285 510M385 390L480 510M385 390L400 510" stroke="#465c6c" stroke-width="15" stroke-linecap="round"/><rect x="338" y="370" width="100" height="24" rx="5" fill="#465c6c"/><path d="M350 367L420 304L450 367Z" fill="#a9b8bb" stroke="#465c6c" stroke-width="3"/><g transform="translate(422 328) rotate(-42)"><rect x="-35" y="-44" width="90" height="85" rx="12" fill="#537c85"/><path d="M55 -55V55" stroke="#233f50" stroke-width="10"/></g><path d="M325 415L740 42" stroke="#b17a26" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="650" y="180" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#875a15">Verso il Polo Nord celeste</text><path d="M590 328A168 168 0 0 0 547 216" fill="none" stroke="#b17a26" stroke-width="4"/><path d="M422 328H590" stroke="#b17a26" stroke-width="2"/><text x="580" y="278" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#875a15">42°</text><circle cx="493" cy="262" r="19" fill="#526b79"/><path d="M493 262L455 223" stroke="#526b79" stroke-width="14"/><g transform="translate(444 196) rotate(20)"><rect x="-51" y="-30" width="90" height="62" rx="9" fill="#233f50"/><rect x="-20" y="-43" width="30" height="18" fill="#233f50"/><rect x="39" y="-22" width="66" height="45" rx="6" fill="#527383"/></g><path d="M550 235L716 295" stroke="#458c82" stroke-width="3"/>