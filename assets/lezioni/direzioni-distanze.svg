<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">Due stelle a distanze diverse possono apparire vicine</title><rect width="760" height="400" rx="14" fill="#edf3f9"/><g font-family="Arial,sans-serif" font-size="18" fill="#17365f" stroke-linecap="round" stroke-linejoin="round"><text x="35" y="38" font-weight="bold">Nello spazio: direzioni e distanze</text><circle cx="80" cy="285" r="7" fill="#17365f"/><path d="M80 285 575 45M80 285 440 90" stroke="#6585a5" stroke-width="2"/><circle cx="260" cy="198" r="7" fill="#c2984f"/><circle cx="530" cy="67" r="7" fill="#c2984f"/><circle cx="405" cy="109" r="7" fill="#2864d7"/><text x="250" y="225">A</text><text x="533" y="51">B</text><text x="413" y="102">C</text><text x="36" y="318">Osservatore</text><path d="M245 285 A165 165 0 0 0 199 171" stroke="#96b0c7" stroke-width="2" fill="none" stroke-dasharray="5 5"/><text x="35" y="363" font-size="16">A e B sono allineate: nel modello hanno la stessa direzione.</text><text x="35" y="387" font-size="16">La sfera celeste descrive gli angoli; non conserva la distanza fisica.</text></g></svg>
